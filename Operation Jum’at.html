<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Operation Jum’at</title>
    <style>
      :root {
        --teal: #3fd0c9;
        --or: #f08a24;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Arial Narrow", Arial, sans-serif;
        color: #fff;
        touch-action: none;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }
      .ov {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: radial-gradient(#0006, #000e);
        z-index: 8;
        transition: opacity 0.8s;
        padding: 20px;
      }
      .ov.h,
      .h {
        opacity: 0;
        pointer-events: none;
      }
      h1 {
        font-size: clamp(30px, 7vw, 80px);
        letter-spacing: 0.08em;
        margin: 0;
        text-transform: uppercase;
        font-weight: 700;
      }
      .t2 {
        color: var(--or);
        letter-spacing: 0.3em;
        margin: 8px 0 28px;
      }
      p.s {
        max-width: 460px;
        color: #cfc6b4;
        line-height: 1.5;
        margin: 0 0 26px;
      }
      button.go {
        background: var(--or);
        color: #111;
        border: 0;
        padding: 14px 38px;
        font:
          700 20px "Arial Narrow",
          Arial;
        letter-spacing: 0.15em;
        cursor: pointer;
      }
      button.go:focus-visible,
      #ch button:focus-visible {
        outline: 3px solid var(--teal);
      }
      #hud {
        position: fixed;
        left: 3vw;
        top: 3vh;
        z-index: 2;
        font-size: 14px;
        letter-spacing: 0.12em;
        text-shadow: 0 1px 3px #000;
        line-height: 1.6;
      }
      #hud small {
        display: block;
        color: #cfc6b4;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      #dlg {
        position: fixed;
        right: 5vw;
        bottom: 12vh;
        width: min(440px, 90vw);
        z-index: 4;
        transition: opacity 0.4s;
      }
      .q {
        background: #000a;
        padding: 12px 16px;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .q b {
        color: var(--teal);
      }
      #ch {
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: opacity 0.5s;
      }
      #ch button {
        display: flex;
        gap: 12px;
        align-items: center;
        text-align: left;
        background: #0b0d0ccc;
        color: #ddd;
        border: 2px solid transparent;
        padding: 12px 14px;
        font:
          16px "Arial Narrow",
          Arial;
        cursor: pointer;
      }
      #ch button i {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #222;
        color: #fff;
        font-style: normal;
        text-align: center;
        line-height: 24px;
        font-weight: 700;
        font-size: 13px;
      }
      #ch button:hover,
      #ch button.on {
        border-color: var(--or);
        color: #fff;
      }
      #ch button:hover i,
      #ch button.on i {
        background: var(--or);
        color: #111;
      }
      #sub {
        position: fixed;
        left: 50%;
        bottom: 11vh;
        transform: translateX(-50%);
        z-index: 4;
        text-align: center;
        font-size: clamp(16px, 2.4vw, 24px);
        text-shadow: 0 2px 4px #000;
        max-width: 80vw;
        transition: opacity 0.4s;
      }
      #sub b {
        color: var(--teal);
      }
      #blood {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 3;
        background: radial-gradient(
          ellipse at center,
          transparent 25%,
          #8a0000cc 80%,
          #300 100%
        );
        transition: opacity 0.15s;
      }
      .sp {
        position: absolute;
        border-radius: 48% 52% 45% 55%;
        background: radial-gradient(
          circle,
          #b00 25%,
          #700 55%,
          transparent 72%
        );
        transition: transform 4s ease-out;
        opacity: 0.9;
      }
      #sand {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background: radial-gradient(
          ellipse at center,
          #c8964a22 30%,
          #b07a3a77 100%
        );
        animation: gust 5s ease-in-out infinite;
      }
      #sand::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.6;
        background: repeating-linear-gradient(
          100deg,
          transparent 0 40px,
          #e8c88a22 40px 42px,
          transparent 42px 90px
        );
        animation: streak 0.7s linear infinite;
      }
      @keyframes gust {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes streak {
        to {
          background-position: -180px 0;
        }
      }
      #iris {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        background: transparent;
      }
      #bt,
      #bb {
        position: fixed;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        z-index: 7;
        transition: height 1.2s;
      }
      body.cine #bt,
      body.cine #bb {
        height: 9vh;
      }
      @media (prefers-reduced-motion: reduce) {
        .sp {
          transition: none;
        }
        #sand,
        #sand::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="sand"></div>
    <div id="hud" class="h">
      <div>DUSTY ALLEY · 11:25</div>
      <div style="color: var(--teal)">ENTITY 101</div>
      <small>BADAI GURUN · DRAG / ← → ↑ ↓ UNTUK LIHAT 360°</small>
    </div>
    <div id="dlg" class="h">
      <div class="q"><b>Red:</b> Gak jum’atan bang?</div>
      <div id="ch" class="h">
        <button class="on" data-i="1"><i>1</i>Ngatur luwh</button>
        <button data-i="2">
          <i>2</i>Baiklah saudaraku aku akan bersiap-siap untuk ke Masjid
        </button>
      </div>
    </div>
    <div id="sub"></div>
    <div id="blood"></div>
    <div id="iris"></div>
    <div id="bt"></div>
    <div id="bb"></div>
    <div class="ov" id="title">
      <h1>Operation Jum’at</h1>
      <div class="t2">CALLSIGN: ENTITY 101</div>
      <p class="s">
        Gang sempit di kota gurun saat badai pasir. Seseorang bersenjata
        mendekat dan mengajukan satu pertanyaan. Jawabanmu menentukan nasibmu.
      </p>
      <button class="go" id="start">MULAI MISI</button>
    </div>
    <div class="ov h" id="end">
      <h1 id="et"></h1>
      <div class="t2" id="es"></div>
      <button class="go" onclick="location.reload()">MAIN LAGI</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const $ = (id) => document.getElementById(id),
        rnd = Math.random,
        PI = Math.PI;
      const scene = new THREE.Scene(),
        cam = new THREE.PerspectiveCamera(65, 1, 0.1, 200);
      scene.add(cam);
      cam.rotation.order = "YXZ";
      const R = new THREE.WebGLRenderer({ antialias: true });
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      R.shadowMap.enabled = true;
      document.body.prepend(R.domElement);
      function rs() {
        R.setSize(innerWidth, innerHeight);
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
      }
      addEventListener("resize", rs);
      rs();

      // ===== badai gurun =====
      const SKY = 0xc99a5e;
      scene.background = new THREE.Color(SKY);
      scene.fog = new THREE.Fog(SKY, 3, 50);
      scene.add(new THREE.HemisphereLight(0xffd9a8, 0x7a5a35, 0.95));
      const sun = new THREE.DirectionalLight(0xffe0b0, 0.95);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0008;
      Object.assign(sun.shadow.camera, {
        left: -28,
        right: 28,
        top: 28,
        bottom: -28,
        far: 90,
      });
      scene.add(sun, sun.target);

      function tex(base, sp, rx, ry) {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const x = c.getContext("2d");
        x.fillStyle = base;
        x.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 1100; i++) {
          x.fillStyle = `rgba(${sp},${rnd() * 0.28})`;
          x.fillRect(rnd() * 128, rnd() * 128, 1 + rnd() * 3, 1 + rnd() * 3);
        }
        for (let i = 0; i < 8; i++) {
          x.fillStyle = `rgba(${sp},.07)`;
          x.fillRect(0, rnd() * 128, 128, 2 + rnd() * 8);
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(rx, ry);
        return t;
      }
      const L = (c, m) =>
        new THREE.MeshLambertMaterial(Object.assign({ color: c }, m || {}));
      const sandM = L(0xffffff, { map: tex("#c9a36b", "90,60,30", 12, 70) }),
        duneM = L(0xc9a36b),
        wood = L(0xffffff, { map: tex("#8a6236", "50,30,10", 1, 1) }),
        dark = L(0x1b1612),
        trim = L(0xe9d9b6),
        glow = L(0xffcf7a, { emissive: 0xffa030 }),
        metal = L(0x55504a),
        rope = L(0x2a2218),
        wallMs = [
          ["#d6b47c", "110,80,40"],
          ["#c8a276", "90,60,35"],
          ["#e0c9a0", "120,90,50"],
          ["#b99568", "80,55,30"],
        ].map(([b, s]) => L(0xffffff, { map: tex(b, s, 2, 1) })),
        awn = [0x9c2f2a, 0x2f5d7a, 0x3b7a4a, 0xb8862b, 0x6a3a7a].map((c) =>
          L(c),
        );
      function mk(w, h, d, m, x, y, z, p) {
        const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        o.position.set(x, y, z);
        o.castShadow = o.receiveShadow = true;
        (p || scene).add(o);
        return o;
      }
      const gnd = new THREE.Mesh(new THREE.PlaneGeometry(60, 260), sandM);
      gnd.rotation.x = -PI / 2;
      gnd.position.z = -60;
      gnd.receiveShadow = true;
      scene.add(gnd);
      function dune(x, z, s) {
        const o = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6), duneM);
        o.scale.set(s * 1.6, s * 0.28, s);
        o.position.set(x, 0, z);
        o.receiveShadow = true;
        scene.add(o);
      }
      // bangunan: jendela, pintu, kanopi, balkon, atap, tali jemuran
      function bld(s, z, d) {
        const w = 4.5 + rnd() * 3,
          h = 4.5 + rnd() * 5,
          x = s * (7.5 + w / 2),
          fx = s * 7.45;
        mk(w, h, d, wallMs[(rnd() * 4) | 0], x, h / 2, z);
        mk(w + 0.3, 0.35, d + 0.3, trim, x, h + 0.17, z);
        const dz = z + (rnd() - 0.5) * d * 0.4;
        mk(0.12, 2.3, 1.3, dark, fx, 1.15, dz);
        mk(0.16, 0.25, 1.7, trim, fx, 2.4, dz);
        const a = mk(1.5, 0.08, 2.8, awn[(rnd() * 5) | 0], s * 6.8, 2.9, dz);
        a.rotation.z = s * 0.2;
        const nf = Math.floor((h - 3) / 2.4);
        for (let f = 0; f < nf; f++)
          for (let k = -1; k <= 1; k++) {
            const zz = z + k * d * 0.3,
              y = 3.7 + f * 2.4;
            mk(0.12, 1, 0.8, rnd() < 0.25 ? glow : dark, fx, y, zz);
            mk(0.18, 0.1, 1, trim, fx, y - 0.55, zz);
          }
        if (rnd() < 0.5) {
          mk(1, 0.1, 2, trim, s * 7, 3.5, z + d * 0.25);
          mk(0.05, 0.6, 2, metal, s * 6.55, 3.85, z + d * 0.25);
        }
        if (rnd() < 0.6) {
          const t = new THREE.Mesh(
            new THREE.CylinderGeometry(0.6, 0.6, 1.2, 10),
            metal,
          );
          t.position.set(x, h + 1, z - d * 0.2);
          t.castShadow = true;
          scene.add(t);
        }
        mk(0.05, 2.5, 0.05, metal, x - s * 1, h + 1.5, z + d * 0.3);
        mk(1, 0.7, 0.8, metal, x + s * 0.8, h + 0.7, z + d * 0.1);
        dune(s * (7.2 + rnd() * 0.8), z + (rnd() - 0.5) * d, 0.8 + rnd() * 1.2);
        if (rnd() < 0.35) {
          const y = 4.2;
          mk(15, 0.03, 0.03, rope, 0, y, z);
          for (let i = 0; i < 4; i++)
            mk(
              0.9,
              0.9,
              0.03,
              awn[(rnd() * 5) | 0],
              -5 + i * 3 + rnd(),
              y - 0.45,
              z,
            );
        }
      }
      for (const s of [-1, 1])
        for (let z = 44; z > -54; z -= 8 + rnd() * 3) bld(s, z, 7 + rnd() * 2);
      mk(30, 7, 2, wallMs[0], 0, 3.5, 47);
      // lapak pasar, tong, peti, karung pasir, mobil rusak, tiang lampu
      function stall(sd, z) {
        const x = sd * 6.3,
          c = awn[(rnd() * 5) | 0];
        for (const [px, pz] of [
          [-0.8, -1.1],
          [0.8, -1.1],
          [-0.8, 1.1],
          [0.8, 1.1],
        ])
          mk(0.08, 2.2, 0.08, wood, x + px, 1.1, z + pz);
        mk(1.8, 0.06, 2.5, c, x, 2.25, z).rotation.z = sd * 0.1;
        mk(1.2, 0.8, 2, wood, x, 0.4, z);
        for (let i = 0; i < 4; i++)
          mk(
            0.4,
            0.3,
            0.4,
            awn[(rnd() * 5) | 0],
            x + (rnd() - 0.5) * 0.6,
            0.95,
            z - 0.7 + i * 0.45,
          );
      }
      for (const z of [30, 16, 4, -12, -26, -40])
        stall(rnd() < 0.5 ? -1 : 1, z + rnd() * 3);
      for (let i = 0; i < 24; i++) {
        const sd = rnd() < 0.5 ? -1 : 1,
          x = sd * (5.9 + rnd() * 1.2),
          z = 40 - rnd() * 92;
        if (rnd() < 0.5) {
          const b = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 0.9, 10),
            metal,
          );
          b.position.set(x, 0.45, z);
          b.castShadow = true;
          scene.add(b);
        } else {
          const sz = 0.5 + rnd() * 0.6;
          mk(sz, sz, sz, wood, x, sz / 2, z).rotation.y = rnd() * 3;
        }
      }
      for (let i = 0; i < 6; i++) {
        const sd = rnd() < 0.5 ? -1 : 1,
          z = 38 - rnd() * 85;
        for (let j = 0; j < 3; j++)
          mk(
            1.1,
            0.35,
            0.5,
            L(0xa8895a),
            sd * 5.6,
            0.18 + (j > 1 ? 0.35 : 0),
            z + ((j * 0.6) % 1.2),
          );
      }
      mk(2, 0.7, 4, L(0x6a6a5a), 5.6, 0.6, -22);
      mk(1.8, 0.6, 2, L(0x5a5a4a), 5.6, 1.25, -22.2).rotation.z = 0.1;
      for (let z = 36; z > -50; z -= 14) {
        const s = z % 28 ? -1 : 1;
        mk(0.1, 4, 0.1, metal, s * 7.1, 2, z);
        mk(0.6, 0.1, 0.1, metal, s * 6.85, 4, z);
      }
      for (let i = 0; i < 40; i++) {
        const r = 0.1 + rnd() * 0.25,
          o = new THREE.Mesh(new THREE.DodecahedronGeometry(r), L(0xa8895a));
        o.position.set(
          (rnd() < 0.5 ? -1 : 1) * (2.6 + rnd() * 4),
          r * 0.4,
          40 - rnd() * 95,
        );
        o.castShadow = true;
        scene.add(o);
      }
      // masjid
      const mq = new THREE.Group();
      mq.position.set(0, 0, -60);
      scene.add(mq);
      const cream = L(0xf0e6cf),
        green = L(0x2e8b57);
      mk(16, 7, 10, cream, 0, 3.5, 0, mq);
      mk(3.4, 4.4, 0.3, dark, 0, 2.2, 5.1, mq);
      mk(3.4, 0.6, 0.35, L(0xc9a227), 0, 4.6, 5.1, mq);
      const dome = new THREE.Mesh(
        new THREE.SphereGeometry(4, 28, 14, 0, PI * 2, 0, PI / 2),
        green,
      );
      dome.position.y = 7;
      dome.castShadow = true;
      mq.add(dome);
      for (const s of [-1, 1]) {
        const m = new THREE.Mesh(
          new THREE.CylinderGeometry(0.7, 0.9, 15, 16),
          cream,
        );
        m.position.set(s * 9, 7.5, 0);
        m.castShadow = true;
        mq.add(m);
        const c = new THREE.Mesh(new THREE.ConeGeometry(1, 2.4, 16), green);
        c.position.set(s * 9, 16.2, 0);
        mq.add(c);
      }
      for (const x of [-5, 5])
        mk(1.2, 2, 0.2, L(0xffd27a, { emissive: 0xffb347 }), x, 3.5, 5.1, mq);

      // ===== karakter =====
      function pixTex(fn) {
        const c = document.createElement("canvas");
        c.width = c.height = 8;
        fn(c.getContext("2d"));
        const t = new THREE.CanvasTexture(c);
        t.magFilter = t.minFilter = THREE.NearestFilter;
        return t;
      }
      const memo = {},
        mem = (k, f) => memo[k] || (memo[k] = f());
      const S = (t) => L(0xffffff, { map: t });
      const shade = (b, v) =>
        mem("s" + b + v, () =>
          S(
            pixTex((x) => {
              x.fillStyle = b;
              x.fillRect(0, 0, 8, 8);
              for (let i = 0; i < 8; i++)
                for (let j = 0; j < 8; j++) {
                  x.fillStyle = `rgba(0,0,0,${rnd() * v})`;
                  x.fillRect(i, j, 1, 1);
                }
            }),
          ),
        );
      const plaid = (a, b) =>
        mem("p" + a + b, () =>
          S(
            pixTex((x) => {
              x.fillStyle = a;
              x.fillRect(0, 0, 8, 8);
              x.fillStyle = b;
              for (let i = 0; i < 8; i += 4) {
                x.fillRect(i, 0, 1, 8);
                x.fillRect(0, i, 8, 1);
              }
              x.fillStyle = "rgba(255,255,255,.18)";
              x.fillRect(2, 2, 1, 1);
              x.fillRect(6, 6, 1, 1);
            }),
          ),
        );
      const faceM = (mask) =>
        mem("f" + mask, () =>
          S(
            pixTex((x) => {
              x.fillStyle = mask || "#c68c64";
              x.fillRect(0, 0, 8, 8);
              if (mask) {
                x.fillStyle = "#c68c64";
                x.fillRect(0, 3, 8, 2);
              }
              x.fillStyle = "#fff";
              x.fillRect(1, 3, 2, 1);
              x.fillRect(5, 3, 2, 1);
              x.fillStyle = "#2a1a10";
              x.fillRect(2, 3, 1, 1);
              x.fillRect(5, 3, 1, 1);
              if (!mask) {
                x.fillRect(1, 2, 2, 1);
                x.fillRect(5, 2, 2, 1);
                x.fillStyle = "rgba(30,20,10,.4)";
                x.fillRect(1, 5, 6, 2);
                x.fillStyle = "#8a4b3a";
                x.fillRect(3, 6, 2, 1);
              }
            }),
          ),
        );
      // mode: "c" tempur, "robe" baju muslim + sarung, "civ" warga biasa
      function soldier(mode, col) {
        const g = new THREE.Group(),
          rb = mode === "robe",
          cv = mode === "civ",
          cb = mode === "c";
        const b = (w, h, d, m, x, y, z, p) => {
          const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
          o.position.set(x, y, z);
          o.castShadow = true;
          (p || g).add(o);
          return o;
        };
        const skin = shade("#c68c64", 0.12),
          top = shade(col.top, rb ? 0.08 : 0.25),
          blk = L(0x151515),
          pants = rb ? skin : shade(col.pants, 0.25),
          hm = cb ? shade(col.mask, 0.12) : skin;
        g.legs = [-0.125, 0.125].map((x) => {
          const p = new THREE.Group();
          p.position.set(x, 0.75, 0);
          g.add(p);
          b(0.25, 0.75, 0.25, pants, 0, -0.375, 0, p);
          b(
            0.27,
            rb ? 0.08 : 0.2,
            0.3,
            rb ? L(0x5b3a1e) : blk,
            0,
            rb ? -0.71 : -0.65,
            0.03,
            p,
          );
          // sarung per kaki: ikut berputar bersama kaki, jadi tidak ada kaki yang menembus kain
          if (rb) b(0.26, 0.74, 0.35, plaid(col.s1, col.s2), 0, -0.31, 0, p);
          return p;
        });
        b(0.5, 0.75, 0.25, top, 0, 1.125, 0);
        if (rb) b(0.58, 0.3, 0.36, plaid(col.s1, col.s2), 0, 0.82, 0);
        if (cb) {
          b(0.54, 0.45, 0.3, L(col.vest), 0, 1.2, 0);
          b(0.14, 0.14, 0.06, blk, 0.14, 0.95, 0.17);
        }
        b(
          0.5,
          0.5,
          0.5,
          [hm, hm, hm, hm, faceM(cb ? col.mask : null), hm],
          0,
          1.75,
          0,
        );
        if (rb) b(0.53, 0.2, 0.53, blk, 0, 2.07, 0);
        else if (cv) b(0.53, 0.16, 0.53, L(col.hair || 0x2a1a10), 0, 2.04, 0);
        else {
          b(0.56, 0.2, 0.56, L(col.helm), 0, 2.07, 0);
          b(0.06, 0.18, 0.12, blk, -0.28, 1.8, 0);
          b(0.06, 0.18, 0.12, blk, 0.28, 1.8, 0);
          b(0.03, 0.03, 0.22, blk, -0.27, 1.68, 0.14);
        }
        g.arms = [-1, 1].map((s) => {
          const p = new THREE.Group();
          p.position.set(s * 0.375, 1.5, 0);
          g.add(p);
          b(0.25, 0.55, 0.25, top, 0, -0.275, 0, p);
          b(0.25, 0.2, 0.25, cb ? blk : skin, 0, -0.65, 0, p);
          return p;
        });
        if (cb) {
          b(0.08, 1.05, 0.12, blk, -0.12, -0.55, 0, g.arms[1]);
          b(0.05, 0.25, 0.05, blk, -0.12, -1.2, 0, g.arms[1]);
          g.arms[0].rotation.z = 0.4;
          g.arms[1].rotation.z = -0.3;
        }
        g.scale.setScalar(0.9);
        scene.add(g);
        return g;
      }
      const arm = (s, a, b) => {
        s.arms[0].rotation.x = a;
        s.arms[1].rotation.x = b === undefined ? a : b;
      };
      function gait(s, t, a = 1) {
        s.legs[0].rotation.x = Math.sin(t * 6) * 0.6 * a;
        s.legs[1].rotation.x = -Math.sin(t * 6) * 0.6 * a;
        s.position.y = Math.abs(Math.sin(t * 6)) * 0.04 * a;
      }
      const red = soldier("c", {
        top: "#6b5a3a",
        pants: "#4a4030",
        vest: 0x2b2f26,
        helm: 0x3a3a30,
        mask: "#8a1414",
      });
      red.position.z = -12;
      // penjaga bersenjata di sekeliling pemain (termasuk di belakang)
      const gm = [
        [5, -6],
        [-5, -9],
        [5, 5],
        [-5, 6.5],
        [4.6, -14],
      ].map(([x, z], i) => {
        const g = soldier("c", {
          top: "#6b5a3a",
          pants: "#4a4030",
          vest: 0x2b2f26,
          helm: 0x3a3a30,
          mask: ["#222", "#3a4a2a", "#8a1414", "#222", "#3a4a2a"][i],
        });
        g.position.set(x, 0, z);
        g.rotation.y = Math.atan2(-x, -z);
        g.ph = rnd() * 9;
        return g;
      });
      // warga ramai
      const TP = ["#f3f1ea", "#e8e2d0", "#b9d9c0", "#cfd8e8", "#d8c9a0"],
        SA = [
          ["#2d6a4f", "#143d2b"],
          ["#7a5230", "#3d2813"],
          ["#3a4a8a", "#1c2650"],
          ["#6a2d2d", "#3a1414"],
        ],
        CT = ["#8a6a4a", "#5a6a7a", "#7a3a3a", "#4a6a4a", "#9a8a5a"],
        CP = ["#3a3a4a", "#4a3a2a", "#2a3a4a"];
      const pk = (a) => a[(rnd() * a.length) | 0];
      function civ() {
        if (rnd() < 0.55) {
          const q = pk(SA);
          return soldier("robe", { top: pk(TP), s1: q[0], s2: q[1] });
        }
        return soldier("civ", {
          top: pk(CT),
          pants: pk(CP),
          hair: pk([0x2a1a10, 0x111111, 0x4a3320]),
        });
      }
      const crowd = [];
      for (let i = 0; i < 24; i++) {
        const idle = i % 3 === 0,
          sd = rnd() < 0.5 ? -1 : 1,
          s = civ(),
          x = sd * (idle ? 4.9 + rnd() * 0.6 : 2.9 + rnd() * 1.7),
          z = -44 + rnd() * 80;
        const o = {
          s,
          x,
          z,
          dir: rnd() < 0.5 ? 1 : -1,
          sp: 0.7 + rnd() * 0.7,
          idle,
          ph: rnd() * 9,
          ry: rnd() * 6.28,
        };
        s.position.set(x, 0, z);
        if (idle) s.rotation.y = o.ry;
        crowd.push(o);
      }
      // viewmodel
      const vm = new THREE.Group();
      cam.add(vm);
      vm.position.set(0.28, -0.3, -0.55);
      for (const [w, h, d, x, y, z, c] of [
        [0.07, 0.11, 0.75, 0, 0, 0, 0x222],
        [0.04, 0.04, 0.4, 0, 0.02, -0.55, 0x111],
        [0.09, 0.2, 0.1, 0, -0.14, 0.1, 0x222],
        [0.1, 0.1, 0.35, -0.05, -0.1, 0.45, 0x5a4a32],
        [0.1, 0.1, 0.35, 0.14, -0.1, 0.3, 0x5a4a32],
      ]) {
        const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), L(c));
        o.position.set(x, y, z);
        vm.add(o);
      }
      // partikel pasir badai (mengalir searah angin, mengikuti kamera)
      const dn = 1800,
        dp = new Float32Array(dn * 3);
      for (let i = 0; i < dn; i++) {
        dp[i * 3] = (rnd() - 0.5) * 36;
        dp[i * 3 + 1] = rnd() * 7;
        dp[i * 3 + 2] = (rnd() - 0.5) * 50;
      }
      const dg = new THREE.BufferGeometry();
      dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
      const pts = new THREE.Points(
        dg,
        new THREE.PointsMaterial({
          color: 0xe2c28a,
          size: 0.1,
          transparent: true,
          opacity: 0.65,
          depthWrite: false,
        }),
      );
      pts.frustumCulled = false;
      scene.add(pts);
      // kilatan tembakan
      const mf = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xfff0b0, fog: false }),
      );
      mf.visible = false;
      scene.add(mf);
      const ml = new THREE.PointLight(0xffc060, 0, 14);
      scene.add(ml);

      // ===== audio =====
      let AC, NB;
      function audio() {
        try {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          const n = AC.sampleRate * 2;
          NB = AC.createBuffer(1, n, AC.sampleRate);
          const d = NB.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = rnd() * 2 - 1;
          const s = AC.createBufferSource();
          s.buffer = NB;
          s.loop = true;
          const f = AC.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = 700;
          const lfo = AC.createOscillator(),
            lg = AC.createGain();
          lfo.frequency.value = 0.15;
          lg.gain.value = 300;
          lfo.connect(lg);
          lg.connect(f.frequency);
          lfo.start();
          const g = AC.createGain();
          g.gain.value = 0.13;
          s.connect(f);
          f.connect(g);
          g.connect(AC.destination);
          s.start();
        } catch (e) {
          AC = null;
        }
      }
      function sfx(fr, du, v, dl = 0) {
        if (!AC) return;
        const T = AC.currentTime + dl,
          s = AC.createBufferSource();
        s.buffer = NB;
        const f = AC.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.value = fr;
        const g = AC.createGain();
        g.gain.setValueAtTime(v, T);
        g.gain.exponentialRampToValueAtTime(0.001, T + du);
        s.connect(f);
        f.connect(g);
        g.connect(AC.destination);
        s.start(T);
        s.stop(T + du);
      }
      function fire(g) {
        const a = g.rotation.y;
        mf.position.set(
          g.position.x + Math.sin(a) * 0.8,
          1.3,
          g.position.z + Math.cos(a) * 0.8,
        );
        ml.position.copy(mf.position);
        mf.visible = true;
        ml.intensity = 8;
        shake = Math.max(shake, 0.8);
        sfx(4000, 0.22, 1.1);
        sfx(500, 0.35, 1.2); // suara tembakan tepat bersamaan dengan kilatan
        setTimeout(() => {
          mf.visible = false;
          ml.intensity = 0;
        }, 70);
      }

      // ===== alur =====
      let st = "title",
        t0 = 0,
        now = 0,
        F = {},
        shake = 0,
        ly = 0,
        lp = 0,
        irisR = 90,
        ent,
        red2,
        ws = [],
        lastStep = 0,
        lastT = 0;
      const keys = {};
      const go = (s) => {
        st = s;
        t0 = now;
        F = {};
      };
      const sub = (h) => {
        $("sub").innerHTML = h;
      };
      function iris() {
        const r = irisR;
        $("iris").style.background =
          r >= 89
            ? "transparent"
            : `radial-gradient(circle at 50% 50%,transparent ${r}vmax,#000 ${r + 0.4}vmax)`;
      }
      function bloodFX() {
        const b = $("blood");
        b.style.opacity = 1;
        for (let i = 0; i < 9; i++) {
          const d = document.createElement("div");
          d.className = "sp";
          const s = 90 + rnd() * 220;
          Object.assign(d.style, {
            width: s + "px",
            height: s * (0.8 + rnd() * 0.5) + "px",
            left: rnd() * 90 + "vw",
            top: rnd() * 70 + "vh",
          });
          b.appendChild(d);
          requestAnimationFrame(
            () =>
              (d.style.transform =
                "translateY(" + (40 + rnd() * 120) + "px) scale(1.15)"),
          );
        }
      }
      function endCard(t, s, c) {
        $("et").textContent = t;
        $("et").style.color = c || "";
        $("es").textContent = s;
        $("end").classList.remove("h");
      }
      function pick(i) {
        if (st !== "choose") return;
        $("dlg").classList.add("h");
        if (i === 1) {
          go("hit");
          vm.visible = true;
          // ayunan -> benturan: suara pukulan tepat saat tinju mengenai (k = 0.45)
          sfx(2500, 0.15, 0.5, 0.3);
          sfx(180, 0.5, 1.4, 0.45);
          sfx(1200, 0.1, 0.8, 0.45);
        } else {
          go("iris");
          sub("");
        }
      }
      document
        .querySelectorAll("#ch button")
        .forEach((b) => (b.onclick = () => pick(+b.dataset.i)));
      addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = 1;
        if (e.key === "1") pick(1);
        if (e.key === "2") pick(2);
      });
      addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = 0;
      });
      // lihat 360° dengan drag / sentuh
      let drag = false,
        px = 0,
        py = 0;
      addEventListener("pointerdown", (e) => {
        if (e.target.closest("button,.ov,#dlg")) return;
        drag = true;
        px = e.clientX;
        py = e.clientY;
      });
      addEventListener("pointerup", () => (drag = false));
      addEventListener("pointermove", (e) => {
        if (!drag) return;
        ly += (e.clientX - px) * 0.005;
        lp = Math.max(-1.2, Math.min(1.2, lp + (e.clientY - py) * 0.004));
        px = e.clientX;
        py = e.clientY;
      });
      $("start").onclick = () => {
        audio();
        $("title").classList.add("h");
        $("hud").classList.remove("h");
        go("intro");
      };
      function setup2() {
        scene.remove(red);
        gm.forEach((g) => {
          arm(g, 0.15);
        });
        vm.visible = false;
        $("blood").style.opacity = 0;
        red2 = soldier("robe", {
          top: "#f3f1ea",
          s1: "#2d6a4f",
          s2: "#143d2b",
        });
        ent = soldier("robe", { top: "#9fd0e8", s1: "#7a5230", s2: "#3d2813" });
        ws = [];
        for (let i = 0; i < 7; i++) {
          const q = SA[i % 4],
            w = soldier("robe", { top: TP[i % 4], s1: q[0], s2: q[1] }),
            tx = -1.2 + rnd() * 2.4;
          w.position.set(
            Math.max(-6.5, Math.min(6.5, tx + (rnd() - 0.5) * 8)),
            0,
            -47 - rnd() * 4,
          );
          w.rotation.y = PI;
          ws.push({ s: w, tx, ts: 8 + i * 1.7, in: 0 });
        }
        document.body.classList.add("cine");
      }
      function loop(ms) {
        requestAnimationFrame(loop);
        now = ms / 1000;
        const t = now - t0,
          dtt = Math.min(0.05, now - (lastT || now));
        lastT = now;
        if (keys.arrowleft || keys.a) ly += dtt * 1.6;
        if (keys.arrowright || keys.d) ly -= dtt * 1.6;
        if (keys.arrowup || keys.w) lp = Math.min(1.2, lp + dtt * 1.2);
        if (keys.arrowdown || keys.s) lp = Math.max(-1.2, lp - dtt * 1.2);
        ly = Math.atan2(Math.sin(ly), Math.cos(ly));
        cam.position.set(0, 1.7, 0);
        let yaw = ly,
          pit = lp,
          roll = 0;
        scene.fog.far = 44 + 8 * Math.sin(now * 0.6) + 4 * Math.sin(now * 1.9);
        for (let i = 0; i < dn; i++) {
          const k = i * 3;
          dp[k] += 18 * dtt;
          if (dp[k] > 18) dp[k] = -18;
          dp[k + 1] += Math.sin(now * 2 + i) * 0.01;
          if (dp[k + 1] < 0) dp[k + 1] = 7;
          if (dp[k + 1] > 7) dp[k + 1] = 0;
          dp[k + 2] -= 3 * dtt;
          if (dp[k + 2] < -25) dp[k + 2] = 25;
        }
        dg.attributes.position.needsUpdate = true;
        // warga & penjaga
        crowd.forEach((c) => {
          const s = c.s;
          if (c.idle) {
            s.rotation.y = c.ry + Math.sin(now * 0.5 + c.ph) * 0.3;
            arm(s, Math.sin(now + c.ph) * 0.1);
            return;
          }
          c.z += c.dir * c.sp * dtt;
          if (c.z > 40) c.dir = -1;
          if (c.z < -48) c.dir = 1;
          s.position.set(c.x, 0, c.z);
          s.rotation.y = c.dir > 0 ? 0 : PI;
          gait(s, now * 1.2 + c.ph, 0.75);
          s.arms[0].rotation.x = Math.sin((now * 1.2 + c.ph) * 6) * 0.35;
          s.arms[1].rotation.x = -Math.sin((now * 1.2 + c.ph) * 6) * 0.35;
        });
        if (st !== "hit" && st !== "walk")
          gm.forEach((g) => {
            g.position.y = Math.sin(now * 1.3 + g.ph) * 0.01;
          });

        if (st === "title") {
          red.position.z = -12;
          arm(red, -1.1);
        } else if (st === "intro") {
          red.position.z = Math.min(-12 + t * 1.8, -3.4);
          gait(red, now);
          arm(red, -1.1);
          if (red.position.z >= -3.4) {
            go("line");
            $("dlg").classList.remove("h");
            red.position.y = 0;
          }
        } else if (st === "line" || st === "choose") {
          arm(red, -1.25);
          red.legs.forEach((l) => (l.rotation.x = 0));
          if (t > 2.6 && st === "line") {
            st = "choose";
            $("ch").classList.remove("h");
          }
        } else if (st === "hit") {
          const k = t;
          ly *= 0.9;
          lp *= 0.9; // kamera otomatis menghadap Red saat dipukul
          if (k < 0.3) {
            red.position.z = -3.4 + (k / 0.3) * 1.5;
            arm(red, -1.25 - (k / 0.3) * 1.7);
            gait(red, now);
          } else if (k < 0.45) {
            const p = (k - 0.3) / 0.15;
            red.position.z = -1.9 + p * 0.8;
            arm(red, -2.95 + p * 2.4);
          } else {
            if (!F.h) {
              F.h = 1;
              bloodFX();
              shake = 1;
              vm.visible = false;
              gm.forEach((g) => arm(g, -1.45));
            }
            const q = Math.min((k - 0.45) / 0.9, 1);
            red.position.z = -1.1 - 0.5 * q;
            arm(red, -0.55 - q * 0.9);
            pit -= 0.45 * q;
            roll = 0.5 * q;
            cam.position.y = 1.7 - 1.1 * q;
            yaw += 0.2 * q;
            // NPC ikut menembak saat pemain limbung (bukan saat sudah tergeletak)
            [
              [0.75, 0],
              [0.95, 2],
              [1.15, 1],
            ].forEach(([tt, i], j) => {
              if (k > tt && !F["g" + j]) {
                F["g" + j] = 1;
                fire(gm[i]);
              }
            });
            if (k > 2.4) R.domElement.style.opacity = 0;
            if (k > 3 && !F.e) {
              F.e = 1;
              endCard("ANDA MELAWAN PERINTAH TUHAN!!!", "MISI GAGAL", "#e33");
            }
          }
        } else if (st === "iris") {
          irisR = Math.max(0, 90 * Math.pow(1 - t / 1.4, 2));
          if (t > 1.5) {
            setup2();
            go("walk");
            irisR = 0;
          }
        } else if (st === "walk") {
          if (!F.in) irisR = Math.min(90, t * 70);
          const z = Math.max(-t * 2.6, -54.6);
          red2.position.set(-0.55, 0, z);
          ent.position.set(0.55, 0, z + 0.1);
          [red2, ent].forEach((s, i) => {
            s.rotation.y = PI;
            gait(s, now + i * 0.6, 0.75);
            s.arms[0].rotation.x = Math.sin(now * 6) * 0.5;
            s.arms[1].rotation.x = -Math.sin(now * 6) * 0.5;
          });
          if (now - lastStep > 0.52 && !F.in) {
            lastStep = now;
            sfx(900, 0.07, 0.2);
          }
          cam.rotation.set(0, 0, 0);
          if (t < 7) {
            cam.position.set(1.8, 1.7, z + 4.5);
            cam.lookAt(0, 1.3, z - 2);
          } else if (t < 13) {
            if (!F.b) F.b = z - 16;
            cam.position.set(-2.2, 1, F.b);
            cam.lookAt(0, 1.3, z);
          } else {
            cam.position.set(5, 3.8, z + 9);
            cam.lookAt(0, 1.3, z - 6);
          }
          if (t > 0.8 && t < 6)
            sub("<b>Red:</b> Nah, gitu dong. Senjata simpan dulu di barak.");
          else if (t > 7.5 && t < 12)
            sub("<b>Entity 101:</b> Siap, Red. Perang bisa nanti.");
          else if (t > 13.5 && t < 18)
            sub("<b>Red:</b> Jumatan dulu, baru lanjut misi.");
          else if (t > 18.5 && !F.in)
            sub("<b>Red:</b> Ayo masuk, khutbah sebentar lagi.");
          else sub("");
          ws.forEach((o) => {
            if (o.in || t < o.ts) return;
            const s = o.s,
              dx = o.tx - s.position.x,
              dz = -55.2 - s.position.z,
              d = Math.hypot(dx, dz);
            if (d < 0.3 || s.position.z < -54.9) {
              o.in = 1;
              s.visible = false;
              return;
            }
            s.position.x += (dx / d) * 1.8 * dtt;
            s.position.z += (dz / d) * 1.8 * dtt;
            s.rotation.y = Math.atan2(dx, dz);
            gait(s, now + o.ts, 0.75);
            s.arms[0].rotation.x = Math.sin(now * 6) * 0.5;
            s.arms[1].rotation.x = -Math.sin(now * 6) * 0.5;
          });
          if (z <= -54.6 && !F.in) {
            F.in = t;
            red2.visible = ent.visible = false;
            sub("");
          }
          if (F.in) irisR = Math.max(0, 90 * Math.pow(1 - (t - F.in) / 1.1, 2));
          if (F.in && t - F.in > 1.3 && !F.e) {
            F.e = 1;
            endCard(
              "MISI SELESAI",
              "Jum’at berkah. Entity 101 dan Red tiba tepat waktu.",
            );
          }
        }
        if (st !== "walk" && st !== "iris" && st !== "title")
          sun.target.position.set(0, 0, -6);
        else sun.target.position.set(0, 0, st === "walk" ? -t * 2.6 : -6);
        sun.position.set(-18, 28, sun.target.position.z + 12);
        if (st !== "walk") {
          shake *= 0.94;
          cam.rotation.set(
            pit + (rnd() - 0.5) * 0.05 * shake,
            yaw + (rnd() - 0.5) * 0.05 * shake,
            roll,
          );
          vm.position.y = -0.3 + Math.sin(now * 1.5) * 0.004;
        }
        pts.position.set(cam.position.x, 0, cam.position.z);
        iris();
        R.render(scene, cam);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
